:root{

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

#cb{min-height:46px;cursor:pointer;border:0}
.res{margin-top:12px;padding:14px 16px;border-radius:14px;display:grid;gap:4px}.res b{font-size:18px}.res.buy{background:var(--ok-soft);color:var(--ok)}.res.mid{background:var(--soft)}.res span{color:var(--ink);font-size:14.5px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.trust>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.trust b{display:block;margin-bottom:4px}.trust span{color:var(--mute);font-size:14px}
@media(max-width:760px){.trust{grid-template-columns:1fr 1fr}}@media(max-width:520px){.trust{grid-template-columns:1fr}.pc .art.big{height:130px}}

.top{max-width:1080px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.sw{position:relative}.more{margin-top:8px}.more summary{font-size:14px}
