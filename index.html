<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Машина времени тенге: цены в Казахстане</title>
<style>
:root{--bg:#eef2f4;--ink:#1b2a33;--mute:#5b6b75;--ev:#b07a0d;--card:#fff;--grid:#d5dde1;--acc:#0e7c86;--rate:#5b6b75;
--s0:#0e7c86;--s1:#b0475e;--s2:#4b6fd0;--s3:#8a6a00;--ok:#1d7a46;--warn:#b07a0d}
@media (prefers-color-scheme:dark){:root{--bg:#14181b;--ink:#e6eef2;--mute:#9aabb5;--ev:#e0a83a;--card:#1c2226;--grid:#2b353b;--acc:#3fc1cc;--rate:#9aabb5;
--s0:#3fc1cc;--s1:#e0839a;--s2:#8fa8f0;--s3:#d9b84a;--ok:#5bc487;--warn:#e0a83a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",Roboto,Arial,sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px 56px}
a{color:var(--acc)}
h1{font-size:clamp(26px,5vw,38px);line-height:1.15;margin:0 0 8px}
h2{font-size:20px;margin:28px 0 12px}
.sub{color:var(--mute);margin:0 0 22px;max-width:62ch}
.crumbs{font-size:14px;margin:0 0 14px;color:var(--mute)}
.crumbs a{text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{display:block;background:var(--card);border-radius:12px;padding:18px;text-decoration:none;color:var(--ink);border:2px solid transparent;position:relative}
a.tile:hover,a.tile:focus-visible{border-color:var(--acc);outline:none}
.tile svg{width:44px;height:44px;display:block;margin-bottom:10px;color:var(--acc)}
.tile b{display:block;font-size:18px}
.tile span{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.tile.off{opacity:.55}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--grid);color:var(--mute);margin-top:8px}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}
.price{font-size:20px;font-weight:700;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{border:2px solid var(--grid);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;text-decoration:none;min-width:104px}
.chip b{display:block;font-size:17px}
.chip span{font-size:13px;color:var(--mute)}
.chip.on{border-color:var(--acc)}
.chip.nodata{opacity:.55}
.note-box{border-left:4px solid var(--ev);background:var(--card);padding:10px 14px;margin:0 0 18px;font-size:14px}
.card{background:var(--card);border-radius:10px;padding:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin:0 0 8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
svg.ch{width:100%;height:auto;display:block;cursor:crosshair;touch-action:pan-y}
.t{font-size:11px;fill:var(--mute)}
.pt{font-size:12px;font-weight:600;fill:var(--ink)}
#tip{min-height:24px;margin:8px 0 0;font-weight:600}
.verdict{margin:20px 0;font-size:17px;max-width:64ch}
.verdict p{margin:0 0 10px}
details{margin-top:16px}
summary{cursor:pointer;color:var(--acc);font-weight:600}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:left}
td:nth-child(n+3),th:nth-child(n+3){text-align:right}
.foot{color:var(--mute);font-size:13px;margin-top:28px}
@media (max-width:560px){.t{font-size:16px}.pt{font-size:18px}.grid{grid-template-columns:1fr 1fr}.tile{padding:14px}}
</style>
</head>
<body>
<main id="app"></main>

<script src="data/data.js"></script>
<script>
(function(){
const D=window.TM;
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MON=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const num=n=>Math.round(n).toLocaleString("ru-RU");
const dec=(n,k)=>n.toFixed(k).replace(".",",");
const f1=n=>(n>0?"+":"")+dec(n,1)+"%";
const pct=(a,b)=>(b/a-1)*100;
const mlab=i=>MON[((i%12)+12)%12]+" "+Math.floor(i/12);
const mIdx=ym=>{const p=ym.split("-");return +p[0]*12+ +p[1]-1};
const pos=d=>{const p=d.split("-");return +p[0]*12+ +p[1]-1+(+p[2]-1)/30};
const dlab=d=>{const p=d.split("-");return +p[2]+" "+MON[+p[1]-1]+" "+p[0]};
const dayNum=d=>Date.parse(d+"T00:00:00Z")/864e5;

const rates={}; D.rates.forEach(r=>rates[r[0]]=r[1]);
const rateKeys=Object.keys(rates).sort();
const lastRateKey=rateKeys[rateKeys.length-1];
function rateFor(date){const k=date.slice(0,7);return k in rates?[rates[k],false]:[rates[lastRateKey],true]}
const byVar={}; D.prices.forEach(p=>{(byVar[p[1]]=byVar[p[1]]||[]).push({d:p[0],s:p[2],v:p[3]})});
const fam=id=>D.families.find(f=>f.id===id);
const memKey=(f,v)=>v.id.slice(f.id.length+1);
function latest(varId){
  const m={}; (byVar[varId]||[]).forEach(p=>{if(!m[p.s]||m[p.s].d<=p.d)m[p.s]=p});
  return Object.values(m);
}
function minNow(varId){const l=latest(varId);return l.length?Math.min(...l.map(p=>p.v)):null}
function famFrom(f){
  const a=f.variants.map(v=>minNow(v.id)).filter(x=>x!==null);
  return a.length?Math.min(...a):null;
}

const ICON_PHONE='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="13" y="4" width="22" height="40" rx="5"/><path d="M21 9h6"/><circle cx="24" cy="38" r="1.6" fill="currentColor"/></svg>';
const ICON_SOON='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="17"/><path d="M24 14v10l7 4"/></svg>';
const STATUS={on_sale:["В продаже","ok"],soon:["Скоро","warn"],limited:["Ограниченно","warn"],archive:["Архив",""]};

function crumbs(parts){
  return '<p class="crumbs">'+parts.map(p=>p[1]?'<a href="'+p[1]+'">'+esc(p[0])+'</a>':esc(p[0])).join(" / ")+'</p>';
}
const FOOT='<p class="foot">Это ориентир на основе прошлых цен, а не гарантия и не финансовый совет. Показана цена с карточки товара в магазине, наличие товара не отслеживается. Курс доллара: средний за месяц по данным Национального банка РК, цена в долларах = цена в тенге / курс месяца. Данные обновлены: '+esc(D.updated)+'.</p>';

function home(){
  app.innerHTML='<h1>Машина времени тенге</h1>'+
  '<p class="sub">Как менялись цены в Казахстане и когда обычно дешевеет. Выберите раздел.</p>'+
  '<div class="grid">'+
  D.categories.map(c=>'<a class="tile" href="#/'+esc(c.id)+'">'+ICON_PHONE+'<b>'+esc(c.name)+'</b><span>iPhone 18 Pro, 18, Duo и прошлые модели</span></a>').join("")+
  ['Валюты','Золото','Квартиры','Машины'].map(n=>'<div class="tile off">'+ICON_SOON+'<b>'+n+'</b><span>Скоро</span></div>').join("")+
  '</div>'+FOOT;
}

function cat(catId){
  const c=D.categories.find(x=>x.id===catId); if(!c)return notFound();
  const fams=D.families.filter(f=>f.category===catId);
  const card=f=>{
    const st=STATUS[f.status]||["",""]; const from=famFrom(f);
    return '<a class="tile" href="#/'+catId+'/'+esc(f.id)+'"><b>'+esc(f.name)+'</b>'+
      '<span class="badge '+st[1]+'">'+st[0]+'</span>'+
      (from?'<div class="price">от '+num(from)+' ₸</div>':'<span>'+(f.status==="soon"?"Цен пока нет":"Нет данных")+'</span>')+'</a>';
  };
  const cur=fams.filter(f=>f.group!=="archive"), old=fams.filter(f=>f.group==="archive");
  app.innerHTML=crumbs([["Главная","#/"],[c.name]])+'<h1>'+esc(c.name)+'</h1>'+
    '<p class="sub">Выберите модель, затем объем памяти.</p>'+
    '<div class="grid">'+cur.map(card).join("")+'</div>'+
    (old.length?'<h2>Прошлые модели</h2><div class="grid">'+old.map(card).join("")+'</div>':'')+FOOT;
}

function famPage(catId,f,memk){
  const c=D.categories.find(x=>x.id===catId);
  const st=STATUS[f.status]||["",""];
  let h=crumbs([["Главная","#/"],[c.name,"#/"+catId],[f.name]])+
    '<h1>'+esc(f.name)+'</h1><span class="badge '+st[1]+'">'+st[0]+'</span>';
  if(f.note) h+='<div class="note-box" style="margin-top:14px">'+esc(f.note)+'</div>';
  if(!f.variants.length){
    app.innerHTML=h+'<p class="sub" style="margin-top:14px">Здесь появятся цены, когда модель поступит в продажу.</p>'+FOOT; return;
  }
  let v=f.variants.find(x=>memKey(f,x)===memk);
  if(!v) v=f.variants.find(x=>(byVar[x.id]||[]).length)||f.variants[0];
  h+='<h2>Объем памяти</h2><div class="chips">'+f.variants.map(x=>{
    const m=minNow(x.id), on=x.id===v.id;
    return '<a class="chip'+(on?' on':'')+(m===null?' nodata':'')+'" href="#/'+catId+'/'+esc(f.id)+'/'+esc(memKey(f,x))+'"><b>'+esc(x.memory)+'</b><span>'+(m===null?'нет данных':'от '+num(m)+' ₸')+'</span></a>';
  }).join("")+'</div>';
  const pts=byVar[v.id]||[];
  if(!pts.length){ app.innerHTML=h+'<p class="sub">Для этой памяти цен пока нет.</p>'+FOOT; return; }
  app.innerHTML=h+'<div class="legend" id="legend"></div><div class="card"><svg class="ch" id="chart" role="img" aria-label="Графики: цена в тенге, курс доллара, цена в долларах"></svg><div id="tip">Наведите курсор на график</div></div>'+
    '<div class="verdict" id="verdict"></div><details><summary>Показать данные</summary><table id="tbl"><thead><tr><th>Дата</th><th>Магазин</th><th>Цена, ₸</th><th>Цена, $</th></tr></thead><tbody></tbody></table></details>'+FOOT;
  chart(f,v,pts);
}

function chart(f,v,pts){
  const stores=[...new Set(pts.map(p=>p.s))];
  const col=i=>"var(--s"+(i%4)+")";
  document.getElementById("legend").innerHTML=stores.map((s,i)=>'<span><i style="background:'+col(i)+'"></i>'+esc(s)+'</span>').join("");
  const usd=p=>p.v/rateFor(p.d)[0];
  const allPos=pts.map(p=>pos(p.d));
  const firstRate=mIdx(rateKeys[0]), lastRate=mIdx(lastRateKey);
  let a=Math.max(firstRate,Math.floor(Math.min(...allPos))-1);
  let b=Math.max(lastRate,Math.floor(Math.max(...allPos)));
  if(b-a<4)a=Math.max(firstRate,b-4);
  const N=b-a+1;
  const W=720,L=(window.innerWidth<560?92:72),R=24,PH=130,TG=30,GAP=18,TOP=8;
  const x=p=>L+(p-a)*(W-L-R)/(b-a);
  const y0=k=>TOP+k*(TG+PH+GAP)+TG;
  const bottom=y0(2)+PH;
  const rp=[]; for(let i=a;i<=b;i++){const k=Math.floor(i/12)+"-"+String(i%12+1).padStart(2,"0"); if(k in rates)rp.push([i,rates[k]])}
  const panels=[
   {t:"Цена в тенге",ser:stores.map(s=>pts.filter(p=>p.s===s).map(p=>[pos(p.d),p.v])),fmt:z=>z>=1e6?dec(z/1e6,2)+" млн":Math.round(z/1000)+" тыс",dots:true},
   {t:"Курс доллара, ₸",ser:[rp],fmt:z=>Math.round(z),dots:false},
   {t:"Цена в долларах",ser:stores.map(s=>pts.filter(p=>p.s===s).map(p=>[pos(p.d),usd(p)])),fmt:z=>"$"+Math.round(z),dots:true}
  ];
  let s=""; const H=bottom+30;
  panels.forEach((p,k)=>{
    const vals=p.ser.flat().map(q=>q[1]);
    const lo=Math.min(...vals),hi=Math.max(...vals),pad=Math.max((hi-lo)*0.15,hi*0.03);
    const mn=lo-pad,mx=hi+pad;
    const yy=z=>y0(k)+PH-(z-mn)*PH/(mx-mn);
    s+='<text x="'+L+'" y="'+(y0(k)-12)+'" class="pt">'+p.t+'</text>';
    for(let g=0;g<=3;g++){const z=mn+(mx-mn)*g/3;
      s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy(z)+'" y2="'+yy(z)+'" stroke="var(--grid)"/><text x="'+(L-8)+'" y="'+(yy(z)+4)+'" text-anchor="end" class="t">'+p.fmt(z)+'</text>'}
    p.ser.forEach((ps,i)=>{
      const c=p.dots?col(i):"var(--rate)";
      if(ps.length>1) s+='<polyline fill="none" stroke="'+c+'" stroke-width="'+(p.dots?1.8:2.4)+'" '+(p.dots?'stroke-dasharray="5 4"':'')+' points="'+ps.map(q=>x(q[0])+","+yy(q[1])).join(" ")+'"/>';
      if(p.dots) ps.forEach(q=>{s+='<circle cx="'+x(q[0])+'" cy="'+yy(q[1])+'" r="'+Math.max(3,8-2*i)+'" fill="'+c+'"/>'});
    });
  });
  const step=Math.max(1,Math.ceil(N/(window.innerWidth<560?5:9)));
  for(let i=a;i<=b;i+=step) s+='<text x="'+x(i)+'" y="'+(bottom+18)+'" text-anchor="'+(x(i)>W-40?'end':'middle')+'" class="t">'+mlab(i)+'</text>';
  (f.events||[]).forEach(e=>{
    const p=pos(e[0]); if(p<a||p>b)return;
    const late=x(p)>W-120;
    s+='<line x1="'+x(p)+'" x2="'+x(p)+'" y1="'+y0(0)+'" y2="'+bottom+'" stroke="var(--ev)" stroke-dasharray="4 3"/>'+
       '<text x="'+(x(p)+(late?-5:5))+'" y="'+(y0(0)+PH-6)+'" text-anchor="'+(late?'end':'start')+'" class="t" style="fill:var(--ev)">'+esc(e[1])+'</text>';
  });
  s+='<line id="cross" x1="-10" x2="-10" y1="'+y0(0)+'" y2="'+bottom+'" stroke="var(--ink)" stroke-opacity=".35"/>';
  const svg=document.getElementById("chart");
  svg.setAttribute("viewBox","0 0 "+W+" "+H); svg.innerHTML=s;

  const tip=document.getElementById("tip");
  function showAt(cx){
    const r=svg.getBoundingClientRect(), px=(cx-r.left)*W/r.width;
    let best=null,bd=1e9;
    pts.forEach(p=>{const d=Math.abs(x(pos(p.d))-px); if(d<bd){bd=d;best=p}});
    if(!best)return;
    const cr=document.getElementById("cross"), xx=x(pos(best.d));
    cr.setAttribute("x1",xx); cr.setAttribute("x2",xx);
    const same=pts.filter(p=>p.d===best.d).sort((q,w)=>q.v-w.v);
    const rt=rateFor(best.d);
    tip.textContent=dlab(best.d)+": "+same.map(p=>p.s+" "+num(p.v)+" ₸").join(", ")+"; курс "+dec(rt[0],2)+(rt[1]?"*":"")+" ₸; около $"+num(usd(best));
  }
  svg.addEventListener("pointermove",e=>showAt(e.clientX));
  svg.addEventListener("pointerdown",e=>showAt(e.clientX));

  const dates=[...new Set(pts.map(p=>p.d))].sort();
  const series=dates.map(d=>({d:d,v:Math.min(...pts.filter(p=>p.d===d).map(p=>p.v))}));
  const U=q=>q.v/rateFor(q.d)[0];
  let html="";
  const first=series[0], last=series[series.length-1];
  if(dayNum(last.d)-dayNum(first.d)>=30){
    html+='<p>С '+dlab(first.d)+' по '+dlab(last.d)+' лучшая цена в тенге изменилась на '+f1(pct(first.v,last.v))+', а в долларах на '+f1(pct(U(first),U(last)))+'. Разница между этими числами это влияние курса.</p>';
  } else {
    html+='<p>История пока короткая: самая ранняя точка '+dlab(first.d)+'. С каждым днем график будет полнее.</p>';
  }
  const nowL=latest(v.id).sort((q,w)=>q.v-w.v);
  if(nowL.length>1 && nowL[0].v!==nowL[nowL.length-1].v)
    html+='<p>Сейчас дешевле всего в магазине '+esc(nowL[0].s)+': '+num(nowL[0].v)+' ₸ (в '+esc(nowL[nowL.length-1].s)+' на '+num(nowL[nowL.length-1].v-nowL[0].v)+' ₸ дороже).</p>';
  (f.events||[]).forEach(e=>{
    const ed=dayNum(e[0]);
    const post=series.find(q=>dayNum(q.d)>=ed-10&&dayNum(q.d)<=ed+60);
    const pre=series.filter(q=>dayNum(q.d)<ed-10).pop();
    if(post&&pre&&post!==pre) html+='<p>Вокруг события "'+esc(e[1])+'" (с '+dlab(pre.d)+' по '+dlab(post.d)+'): цена в тенге '+f1(pct(pre.v,post.v))+', курс '+f1(pct(rateFor(pre.d)[0],rateFor(post.d)[0]))+', цена в долларах '+f1(pct(U(pre),U(post)))+'.</p>';
  });
  if(pts.some(p=>rateFor(p.d)[1])) html+='<p style="font-size:14px;color:var(--mute)">* За этот месяц курса еще нет, взят последний известный.</p>';
  html+='<p>Точек мало, поэтому это ориентир, а не прогноз.</p>';
  document.getElementById("verdict").innerHTML=html;

  const tb=document.querySelector("#tbl tbody");
  pts.slice().sort((q,w)=>w.d.localeCompare(q.d)||q.s.localeCompare(w.s)).forEach(p=>{
    tb.insertAdjacentHTML("beforeend",'<tr><td>'+dlab(p.d)+'</td><td>'+esc(p.s)+'</td><td>'+num(p.v)+'</td><td>$'+num(usd(p))+'</td></tr>');
  });
}

function notFound(){app.innerHTML=crumbs([["Главная","#/"]])+'<h1>Страница не найдена</h1><p class="sub"><a href="#/">На главную</a></p>'}

function route(){
  const p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  window.scrollTo(0,0);
  if(!p.length) return home();
  if(p.length===1) return cat(p[0]);
  const f=fam(p[1]); if(!f||f.category!==p[0]) return notFound();
  famPage(p[0],f,p[2]);
}
window.addEventListener("hashchange",route);
route();
})();
</script>
</body>
</html>
