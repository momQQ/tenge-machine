<style>
:root{
  color-scheme:light;
  --bg:#ffffff;--card:#ffffff;--ink:#181c3a;--mute:#454b6b;--line:#e8eaf2;--soft:#f5f6fb;
  --time:#f2a200;--bad:#b42318;--bad-soft:#fde4e1;--yel:#8a6200;--yel-soft:#fff1b8;--ok:#0b7f55;--ok-soft:#def5ea;--warn:#9a5d00;--warn-soft:#fdf0d3;--info:#3b5bdb;
  --s0:#3b5bdb;--s1:#d6336c;--s2:#c97a00;--s3:#0f9d8a;--s4:#7048e8;--grid:#e9ebf5;--rate:#6b7194;
  --disp:"Unbounded","Onest",system-ui,sans-serif;--text:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--text)}
a{color:var(--info)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--time);outline-offset:2px;border-radius:6px}
.top{max-width:880px;margin:0 auto;padding:16px 16px 0}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--disp);font-weight:600;font-size:14px}
.logo svg{width:30px;height:30px;flex:none}
main{max-width:1080px;margin:0 auto;padding:14px 16px 56px}
h1{font-family:var(--disp);font-weight:600;font-size:clamp(24px,5vw,34px);line-height:1.15;margin:4px 0 6px;letter-spacing:-.01em}
h2{font-family:var(--disp);font-weight:500;font-size:19px;margin:34px 0 4px;letter-spacing:-.01em}
.lead{color:var(--mute);font-size:14px;margin:0 0 12px;max-width:62ch}
.sub{color:var(--mute);margin:0 0 20px;max-width:56ch}
.crumbs{font-size:14px;margin:6px 0 10px;color:var(--mute)}
.crumbs a{color:var(--mute);text-decoration:none}@media (hover:hover) and (pointer:fine){.crumbs a:hover{color:var(--ink);text-decoration:underline}}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:var(--ink);transition:border-color .15s}
@media (hover:hover) and (pointer:fine){a.tile:hover,a.tile:focus-visible{border-color:var(--info)}}
.tile .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--info);display:grid;place-items:center;margin-bottom:10px;font-family:var(--disp);font-weight:600;font-size:18px}
.tile .ic svg{width:24px;height:24px}
.tile .ic.img{background:#fff;border:1px solid var(--line)}
.tile .ic img{width:28px;height:28px;object-fit:contain;display:block}
.tile b{display:block;font-size:17px}
.tile .s{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.tile.off{opacity:.55}
.art{display:grid;place-items:center;background:#fff;border-radius:12px;overflow:hidden;padding:6px}
.art.big{height:140px;margin-bottom:10px}
.art img{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain;display:block;min-width:0;min-height:0}
.art svg{height:100%;width:auto;display:block;max-height:110px}
.art.ill{background:var(--soft)}
.head{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.head .art{width:88px;height:88px;flex:none;border:1px solid var(--line)}
.head .art.ill svg{max-height:70px}
.cap{font-size:12px;color:var(--mute);margin:0 0 4px}
.cap a{color:var(--mute)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button,.seg a{border:0;background:transparent;border-radius:9px;padding:8px 16px;cursor:pointer;white-space:nowrap;font-size:15px;color:var(--mute);text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.seg .on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(20,28,70,.18)}
.note{border-left:4px solid var(--time);background:var(--card);padding:9px 13px;margin:10px 0 0;font-size:14px;border-radius:0 10px 10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{display:inline-block;background:var(--time);color:#201500;text-decoration:none;font-weight:700;border-radius:11px;padding:11px 20px;font-size:15px;margin-top:12px;min-height:44px}
@media (hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.06)}}
.verdict .vt{font-family:var(--disp);font-weight:600;font-size:19px;margin:0 0 8px;padding:6px 12px;border-radius:10px;display:inline-block}
.verdict ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.verdict li{display:flex;gap:10px;font-size:14.5px;line-height:1.45}
.verdict li i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--mute)}
.verdict li.dn i{background:var(--ok)}.verdict li.up i{background:var(--warn)}
.unit{font-size:12px;font-weight:600;fill:var(--mute)}
.ro{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:15px;line-height:1.5}
.ro b{font-weight:700}
.ro .pr{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px;font-size:14px}
.ro .up{color:var(--warn);font-weight:700}.ro .dn{color:var(--ok);font-weight:700}
.cal{display:grid;gap:8px}
.cal .it{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.cal .it:last-child{border-bottom:0}
.cal time{font-weight:700;font-size:14px}
.cal b{display:block;font-size:15px}
.cal span{color:var(--mute);font-size:13.5px}
@media (max-width:520px){.cal .it{grid-template-columns:1fr;gap:2px}}
details{margin-top:14px}
summary{cursor:pointer;color:var(--info);font-weight:600;font-size:15px}
table.d{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
table.d td,table.d th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
table.d td:nth-child(n+3),table.d th:nth-child(n+3){text-align:right}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin:6px 0}
.chk input{width:18px;height:18px}
.foot{color:var(--mute);font-size:13px;margin-top:34px;max-width:70ch;border-top:1px solid var(--line);padding-top:14px}
.prose p,.prose li{max-width:66ch}
.prose h2{margin-top:26px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:560px){.tile{padding:13px}.card{padding:14px}}
.sbox{display:flex;align-items:center;gap:10px;background:#fff;color:#585e82;border-radius:14px;padding:0 16px;box-shadow:0 8px 24px rgba(10,20,80,.25)}
.sbox input{border:0;outline:0;background:transparent;flex:1;padding:15px 0;font-size:16px;color:#181c3a;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin:26px 0 10px}
.pc{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}
@media (hover:hover) and (pointer:fine){.pc:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(30,40,110,.14)}}
.pc .art.big{height:170px;margin:0;border-radius:0;background:linear-gradient(180deg,#f3f4fc,#fff)}
.pc .art.ill{background:linear-gradient(180deg,var(--soft),var(--card))}
.pm{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;font-size:14px;color:var(--mute);min-height:26px}
.heart{position:absolute;top:10px;right:10px;z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--mute);line-height:1}.heart.on{color:#e03131}
#cb{min-height:46px;cursor:pointer;border:0}
.res{margin-top:12px;padding:14px 16px;border-radius:14px;display:grid;gap:4px}.res b{font-size:18px}.res.buy{background:var(--ok-soft);color:var(--ok)}.res.mid{background:var(--soft)}.res span{color:var(--ink);font-size:14.5px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.trust>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.trust b{display:block;margin-bottom:4px}.trust span{color:var(--mute);font-size:14px}
@media(max-width:760px){.trust{grid-template-columns:1fr 1fr}}@media(max-width:520px){.trust{grid-template-columns:1fr}.pc .art.big{height:130px}}

.top{max-width:1080px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .logo{margin-right:auto}.logo small{display:block;font-family:var(--text);font-weight:500;font-size:11.5px;color:var(--mute);margin-top:-1px}
.logo .lt{line-height:1.1}
.city{position:relative}.city summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600;font-size:15px;color:var(--ink)}
.city summary::-webkit-details-marker{display:none}.city summary:after{content:"";width:7px;height:7px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg) translateY(-2px)}
.lang{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px}.lang button{border:0;background:transparent;border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--mute);cursor:pointer;min-height:32px}.lang .on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,28,70,.18)}
.tone-slow .vt,.vchip.slow,.res.slow,.tone-mid .vt,.vchip.mid,.res.mid{background:var(--yel-soft);color:var(--yel)}
.tone-buy .vt,.vchip.buy,.res.buy{background:var(--ok-soft);color:var(--ok)}
.res.mid,.res.slow,.res.wait,.res.buy{color:var(--ink)}.res b{display:block}.res.mid,.res.slow{border-left:5px solid #e2b007}.res.buy{border-left:5px solid var(--ok)}
.verdict li.dn i{background:var(--bad)}.verdict li.up i{background:var(--ok)}

@media (max-width:560px){
  .top{flex-wrap:nowrap;gap:8px;padding:12px 12px 0}.top .logo{min-width:0;font-size:15px}.logo small{display:none}
  .city summary{padding:7px 12px;font-size:14px}.lang button{padding:6px 10px}
  main{padding:10px 12px 48px}
  .bar{margin-top:22px}.bar h2{font-size:18px}
  .pm{flex-wrap:wrap;gap:4px}
  .btn{display:block;text-align:center;width:100%}
  .seg{width:100%}.seg button,.seg a{flex:1;justify-content:center;padding:8px 6px;font-size:14px}
  h2{font-size:18px;margin-top:28px}.lead{font-size:14px}
  .cal .it{padding:12px 0}
}
.sw{position:relative}.more{margin-top:8px}.more summary{font-size:14px}
.verdict .more ul{margin-top:8px}
.inst table.d td,.inst table.d th{text-align:center}.inst table.d td:first-child,.inst table.d th:first-child{text-align:left}
.inst td.ok b{display:block;font-size:16px}.inst td.ok small{color:var(--mute);font-size:12px}.inst td.best{background:var(--ok-soft);box-shadow:inset 0 0 0 3px var(--card)}.inst td.best b{color:var(--ok)}.inst td.no{color:var(--mute)}
.pc .art.big{position:relative}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.st small{display:block;color:var(--mute);font-size:13px}.st b{display:block;font-family:var(--disp);font-size:19px;margin:2px 0}.st em{font-style:normal;font-size:12.5px;color:var(--mute)}.st em.up{color:var(--bad)}.st em.dn{color:var(--ok)}
@media(max-width:560px){.st{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 10px}.st small{grid-column:1/2}.st b{grid-column:2/3;grid-row:1/3;text-align:right}.st em{grid-column:1/2}}
.buy{margin-top:14px;border-top:1px solid rgba(255,255,255,.18);padding-top:12px}
.bn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bn i{font-style:normal;font-size:11.5px;font-weight:700;background:var(--ok-soft);color:var(--ok);border-radius:99px;padding:2px 9px}
.tg{font-style:normal;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--soft);color:var(--mute)}
.tg.ok{background:var(--ok-soft);color:var(--ok)}.tg.wn{background:var(--yel-soft);color:var(--yel)}.tg.gr{background:rgba(255,255,255,.18);color:inherit}
.bn b{font-weight:700}
.tg{white-space:nowrap}
.br{display:grid;grid-template-columns:1fr auto 170px;gap:12px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--line)}
.br.best{background:var(--ok-soft);border-radius:14px;border-bottom-color:transparent}
.br .tg.gr,.kb2 .tg.gr{background:var(--soft);color:var(--mute)}.tg.pu{background:#ece8ff;color:#5a3bd1}
@media(max-width:620px){.br{grid-template-columns:1fr auto}}
@media(max-width:620px){.br{grid-template-columns:minmax(0,1fr) auto}}
.sav{width:34px;height:34px;border-radius:50%;background:#ece8ff;color:#5a3bd1;display:grid;place-items:center;font-weight:800;font-size:14px}
.br.best .tg.ok{background:transparent;padding-left:0}
@media(max-width:620px){.br{grid-template-columns:minmax(0,1fr) auto}}
.bin{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding-top:2px}
.bin em{font-style:normal;font-size:12.5px;color:var(--mute);font-weight:600;margin-right:2px}
@media(max-width:620px){.br .bin{order:3}}
.mc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}

main{max-width:1180px}
