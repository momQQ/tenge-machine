name: daily-fx

on:
  schedule:
    # Каждые 3 часа (по UTC в 07 минут). GitHub может запустить с опозданием.
    - cron: "7 */3 * * *"
  workflow_dispatch:   # кнопка "Run workflow" для ручного запуска

permissions:
  contents: write      # чтобы сохранять обновленные данные в репозиторий

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать курсы валют
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python collector/fx.py

      - name: Снимок цен ЖК для истории
        run: python collector/apt_snapshot.py

      - name: Адреса обменников для кнопки Найти рядом
        continue-on-error: true
        run: python collector/geo.py

      - name: Сохранить данные в репозитории
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Обновление цен $(date -u +%F\ %H:%M)"
          git pull --rebase
          git push
